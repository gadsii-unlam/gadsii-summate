<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; fill: #111827; }
  .t { font-size: 14px; }
  .n { font-size: 15px; font-weight: 700; }
  .s { font-size: 12.5px; fill: #374151; }
  .h { font-size: 13px; font-weight: 700; letter-spacing: .4px; fill: #374151; }
  .ti { font-size: 20px; font-weight: 700; }
  .azul  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.6; }
  .ambar { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
  .verde { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
  .gris  { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; stroke-dasharray: 6 4; }
  .rojo  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
  .banda { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
  .mvp   { fill: none; stroke: #1d4ed8; stroke-width: 3.5; stroke-dasharray: 12 6; }
  .flecha { stroke: #111827; stroke-width: 1.8; fill: none; marker-end: url(#p); }
  .flecha-g { stroke: #6b7280; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#pg); }
  .flecha-a { stroke: #1d4ed8; stroke-width: 2.4; fill: none; marker-end: url(#pa); }
</style><defs>
  <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>
<text x="24" y="32" class="ti">Diagrama 2 — Arquitectura de la gran visión del TP1 y lo que ya cubre el MVP</text><rect x="60" y="52" width="420" height="44" rx="8" class="banda"/><text x="270" y="78" text-anchor="middle" class="t">Navegante · ingresante con celular y señal irregular</text><rect x="700" y="52" width="440" height="44" rx="8" class="banda"/><text x="920" y="78" text-anchor="middle" class="t">Administrador · mantiene el mapa y los cierres</text><rect x="46" y="118" width="448" height="388" rx="12" class="mvp"/><rect x="60" y="106" width="196" height="22" rx="4" fill="#1d4ed8"/><text x="68" y="122" class="s" style="fill:#fff;font-weight:700">CUBIERTO POR EL MVP</text><rect x="60" y="138" width="420" height="238" rx="8" class="azul"/><text x="72" y="160" class="n">PWA del Navegante</text><rect x="72" y="172" width="192" height="54" rx="6" class="azul"/><text x="168" y="194" text-anchor="middle" class="n">Mapa y búsqueda</text><text x="168" y="212" text-anchor="middle" class="t">React + Leaflet</text><rect x="276" y="172" width="192" height="54" rx="6" class="azul"/><text x="372" y="194" text-anchor="middle" class="n">Motor de rutas A*</text><text x="372" y="212" text-anchor="middle" class="t">en el dispositivo</text><rect x="72" y="236" width="192" height="54" rx="6" class="azul"/><text x="168" y="258" text-anchor="middle" class="n">Service worker</text><text x="168" y="276" text-anchor="middle" class="t">caché sin conexión</text><rect x="276" y="236" width="192" height="54" rx="6" class="ambar"/><text x="372" y="258" text-anchor="middle" class="n">Cierres y clima</text><text x="372" y="276" text-anchor="middle" class="t">hoy: manual + simulado</text><rect x="72" y="302" width="396" height="60" rx="6" class="gris"/><text x="270" y="327" text-anchor="middle" class="n">Servicio más cercano + horarios de atención</text><text x="270" y="345" text-anchor="middle" class="t">baños, máquinas, comedor, biblioteca abiertos o cerrados</text><rect x="60" y="410" width="420" height="82" rx="8" class="azul"/><text x="270" y="437" text-anchor="middle" class="n">Archivos estáticos (Cloudflare Workers)</text><text x="270" y="455" text-anchor="middle" class="t">grafo, lugares, plano y cierres.json</text><text x="270" y="473" text-anchor="middle" class="t">publicados a mano con cada deploy</text><path d="M270,376 L270,410" class="flecha-a"/><text x="280" y="398" class="s" text-anchor="start">hoy</text><rect x="700" y="138" width="440" height="100" rx="8" class="gris"/><text x="920" y="174" text-anchor="middle" class="n">Panel de administración web</text><text x="920" y="192" text-anchor="middle" class="t">alta y baja de cierres, horarios de atención</text><text x="920" y="210" text-anchor="middle" class="t">y edición del mapa · con login</text><path d="M920,96 L920,138" class="flecha"/><path d="M920,238 L920,288" class="flecha"/><rect x="560" y="288" width="580" height="140" rx="8" class="gris"/><text x="572" y="310" class="n">API / backend (p. ej. Cloudflare Workers)</text><rect x="572" y="322" width="178" height="58" rx="6" class="gris"/><text x="661" y="346" text-anchor="middle" class="t">Cierres con</text><text x="661" y="364" text-anchor="middle" class="t">versión (ETag)</text><rect x="762" y="322" width="178" height="58" rx="6" class="gris"/><text x="851" y="346" text-anchor="middle" class="t">Lugares y horarios</text><text x="851" y="364" text-anchor="middle" class="t">de atención</text><rect x="952" y="322" width="176" height="58" rx="6" class="gris"/><text x="1040" y="346" text-anchor="middle" class="t">Autenticación</text><text x="1040" y="364" text-anchor="middle" class="t">de administradores</text><text x="572" y="410" class="s">+ proxy del clima con caché y reportes colaborativos con fotos (fase posterior)</text><path d="M480,350 L560,350" class="flecha-g"/><text x="502" y="342" class="s" text-anchor="start">cierres</text><rect x="560" y="468" width="290" height="92" rx="8" class="gris"/><text x="705" y="500" text-anchor="middle" class="n">Base de datos persistente</text><text x="705" y="518" text-anchor="middle" class="t">p. ej. Cloudflare D1 (SQLite)</text><text x="705" y="536" text-anchor="middle" class="t">grafo, lugares, cierres con vigencia</text><rect x="870" y="468" width="270" height="92" rx="8" class="gris"/><text x="1005" y="500" text-anchor="middle" class="n">API meteorológica real</text><text x="1005" y="518" text-anchor="middle" class="t">p. ej. Open-Meteo</text><text x="1005" y="536" text-anchor="middle" class="t">reemplaza al clima simulado</text><path d="M700,428 L700,468" class="flecha"/><path d="M1005,428 L1005,468" class="flecha"/><rect x="560" y="600" width="580" height="86" rx="8" class="rojo"/><text x="572" y="629" text-anchor="start" class="n">Mayor salto: de archivos publicados a mano a un backend con base persistente</text><text x="572" y="647" text-anchor="start" class="t">hoy un cierre es editar cierres.json, validar y volver a publicar;</text><text x="572" y="665" text-anchor="start" class="t">la visión pide que un administrador lo cargue y llegue al celular, incluso con señal irregular.</text><path d="M700,600 L700,560" class="flecha"/><rect x="24" y="720" width="26" height="16" rx="3" class="azul"/><text x="58" y="733" class="t">Construido y en uso (MVP)</text><rect x="254" y="720" width="26" height="16" rx="3" class="ambar"/><text x="288" y="733" class="t">MVP en versión simulada o manual</text><rect x="544" y="720" width="26" height="16" rx="3" class="gris"/><text x="578" y="733" class="t">Visión: todavía no existe</text><rect x="774" y="720" width="26" height="16" rx="3" class="rojo"/><text x="808" y="733" class="t">Salto arquitectónico</text><text x="24" y="764" class="s">Flechas: «A → B» significa que A depende de B. Línea punteada gris: relación que recién existiría con la visión.</text><text x="24" y="784" class="s">Fuente de la visión: brief del TP1 (funciones 1 a 5, administrador y API meteorológica). Los reportes colaborativos se postergaron en el brief v4.</text>
</svg>
