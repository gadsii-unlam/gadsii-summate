<rect width="1200" height="840" fill="#ffffff"/><text x="24" y="32" class="ti">Diagrama 1 — Arquitectura real del MVP «¿Dónde queda?» (tal como está hoy)</text><rect x="24" y="48" width="1152" height="80" rx="10" class="banda"/><text x="38" y="68" class="h">TIEMPO DE BUILD — en la máquina del equipo (no viaja al navegador)</text><rect x="40" y="76" width="700" height="44" rx="8" class="azul"/><text x="52" y="96" text-anchor="start" class="n">Build</text><text x="52" y="114" text-anchor="start" class="t">convierte el plano del campus en JSON y valida los cierres</text><rect x="950" y="76" width="210" height="44" rx="8" class="ambar"/><text x="962" y="96" text-anchor="start" class="n">Deploy manual</text><text x="962" y="114" text-anchor="start" class="t">wrangler deploy</text><path d="M740,98 L950,98" class="flecha"/><rect x="24" y="140" width="1152" height="120" rx="10" class="banda"/><text x="38" y="160" class="h">HOSTING — Cloudflare Workers: solo archivos estáticos (sin servidor ni base de datos)</text><rect x="40" y="170" width="270" height="80" rx="8" class="verde"/><text x="52" y="190" text-anchor="start" class="n">Datos del campus</text><text x="52" y="208" text-anchor="start" class="t">grafo, lugares y plano</text><text x="52" y="226" text-anchor="start" class="t">(generados en el build)</text><rect x="330" y="170" width="270" height="80" rx="8" class="ambar"/><text x="342" y="190" text-anchor="start" class="n">cierres.json</text><text x="342" y="208" text-anchor="start" class="t">editado a mano</text><text x="342" y="226" text-anchor="start" class="t">sin panel de administración</text><rect x="620" y="170" width="270" height="80" rx="8" class="ambar"/><text x="632" y="190" text-anchor="start" class="n">Clima simulado</text><text x="632" y="208" text-anchor="start" class="t">archivos JSON fijos</text><text x="632" y="226" text-anchor="start" class="t">"fuente": "simulado"</text><rect x="910" y="170" width="250" height="80" rx="8" class="azul"/><text x="922" y="190" text-anchor="start" class="n">Bundle de la app</text><text x="922" y="208" text-anchor="start" class="t">HTML, JS y CSS</text><text x="922" y="226" text-anchor="start" class="t">(React + Leaflet)</text><path d="M1055,120 L1055,170" class="flecha"/><text x="1063" y="150" class="s" text-anchor="start">publica</text><rect x="24" y="280" width="1152" height="436" rx="10" class="banda"/><text x="230" y="300" class="h">DISPOSITIVO DEL USUARIO (PWA)</text><rect x="40" y="308" width="1120" height="62" rx="8" class="azul"/><text x="52" y="328" text-anchor="start" class="n">Service Worker (Workbox)</text><text x="52" y="346" text-anchor="start" class="t">guarda la app y los datos para usar sin conexión; cierres.json: red primero, con copia guardada</text><path d="M175,308 L175,250" class="flecha"/><path d="M465,308 L465,250" class="flecha"/><path d="M755,308 L755,250" class="flecha"/><path d="M1035,308 L1035,250" class="flecha"/><text x="183" y="272" class="s" text-anchor="start">HTTPS</text><rect x="40" y="394" width="1120" height="62" rx="8" class="azul"/><text x="52" y="414" text-anchor="start" class="n">App.tsx — raíz de composición</text><text x="52" y="432" text-anchor="start" class="t">carga los datos y arma el resto de las piezas: lo conoce todo, por eso concentra mucha lógica de armado</text><path d="M600,394 L600,370" class="flecha"/><text x="608" y="386" class="s" text-anchor="start">fetch()</text><rect x="40" y="484" width="480" height="146" rx="8" class="azul"/><text x="52" y="504" text-anchor="start" class="n">Interfaz (src/ui/)</text><text x="52" y="522" text-anchor="start" class="t">Pantalla, hoja inferior, búsqueda y avisos</text><text x="52" y="540" text-anchor="start" class="t">Mapa con Leaflet sobre el plano del campus</text><text x="52" y="558" text-anchor="start" class="t">Estado de la pantalla con un reducer</text><rect x="570" y="484" width="590" height="146" rx="8" class="azul"/><text x="582" y="504" text-anchor="start" class="n">Dominio (sin React ni Leaflet)</text><rect x="582" y="516" width="180" height="46" rx="6" class="azul"/><text x="672.0" y="535" text-anchor="middle" class="n">rutas</text><text x="672.0" y="552" text-anchor="middle" class="t">ruta más corta (A*)</text><rect x="780" y="516" width="180" height="46" rx="6" class="ambar"/><text x="870.0" y="535" text-anchor="middle" class="n">clima</text><text x="870.0" y="552" text-anchor="middle" class="t">ajuste por clima</text><rect x="978" y="516" width="180" height="46" rx="6" class="azul"/><text x="1068.0" y="535" text-anchor="middle" class="n">cierres</text><text x="1068.0" y="552" text-anchor="middle" class="t">tramos cerrados</text><rect x="582" y="570" width="180" height="46" rx="6" class="azul"/><text x="672.0" y="589" text-anchor="middle" class="n">busqueda</text><text x="672.0" y="606" text-anchor="middle" class="t">lugares y recientes</text><rect x="780" y="570" width="180" height="46" rx="6" class="azul"/><text x="870.0" y="589" text-anchor="middle" class="n">conexion</text><text x="870.0" y="606" text-anchor="middle" class="t">estado de la red</text><rect x="978" y="570" width="180" height="46" rx="6" class="azul"/><text x="1068.0" y="589" text-anchor="middle" class="n">datos</text><text x="1068.0" y="606" text-anchor="middle" class="t">tipos y carga</text><path d="M280,456 L280,484" class="flecha"/><path d="M865,456 L865,484" class="flecha"/><path d="M520,557 L570,557" class="flecha"/><text x="545" y="549" class="s" text-anchor="middle">usa</text><rect x="40" y="652" width="1120" height="52" rx="8" class="verde"/><text x="52" y="672" text-anchor="start" class="n">Persistencia en el dispositivo (nada sale del teléfono)</text><text x="52" y="690" text-anchor="start" class="t">localStorage y sessionStorage: recorrido en curso, recientes y escenario de clima · Cache Storage: app y datos</text><path d="M280,630 L280,652" class="flecha"/><text x="288" y="646" class="s" text-anchor="start">lee / escribe</text><path d="M865,630 L865,652" class="flecha"/><rect x="24" y="736" width="26" height="16" rx="3" class="azul"/><text x="58" y="749" class="t">Construido y en uso</text><rect x="224" y="736" width="26" height="16" rx="3" class="ambar"/><text x="258" y="749" class="t">Simulado o cargado a mano (definido en el TP3)</text><rect x="604" y="736" width="26" height="16" rx="3" class="verde"/><text x="638" y="749" class="t">Datos y persistencia</text><rect x="824" y="736" width="26" height="16" rx="3" class="gris"/><text x="858" y="749" class="t">No existe en el MVP</text><rect x="24" y="764" width="1152" height="46" rx="8" class="gris"/><text x="36" y="784" text-anchor="start" class="n">No existe en el MVP</text><text x="36" y="802" text-anchor="start" class="t">backend · base de datos · panel de administración · API de clima real · servicio más cercano y horarios de atención</text><text x="24" y="830" class="s">Flechas: «A → B» significa que A depende de B (lo importa o lo pide). Fuente: lectura de src/ y de src/openspec/ (noviembre de 2026).</text></svg>
