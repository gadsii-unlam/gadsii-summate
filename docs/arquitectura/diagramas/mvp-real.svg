<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960">
<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; fill: #111827; }
  .t { font-size: 14px; }
  .n { font-size: 15px; font-weight: 700; }
  .s { font-size: 12.5px; fill: #374151; }
  .h { font-size: 13px; font-weight: 700; letter-spacing: .4px; fill: #374151; }
  .ti { font-size: 20px; font-weight: 700; }
  .azul  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.6; }
  .ambar { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
  .verde { fill: #dcfce7; stroke: #15803d; stroke-width: 1.6; }
  .gris  { fill: #f3f4f6; stroke: #6b7280; stroke-width: 1.6; stroke-dasharray: 6 4; }
  .rojo  { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.6; }
  .banda { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.2; }
  .mvp   { fill: none; stroke: #1d4ed8; stroke-width: 3.5; stroke-dasharray: 12 6; }
  .flecha { stroke: #111827; stroke-width: 1.8; fill: none; marker-end: url(#p); }
  .flecha-g { stroke: #6b7280; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#pg); }
  .flecha-a { stroke: #1d4ed8; stroke-width: 2.4; fill: none; marker-end: url(#pa); }
</style><defs>
  <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker>
  <marker id="pg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
  <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
</defs>
<rect width="1200" height="960" fill="#ffffff"/>
<text x="24" y="32" class="ti">Diagrama 1 — Arquitectura real del MVP «¿Dónde queda?» (tal como está hoy)</text><rect x="24" y="48" width="1152" height="84" rx="10" class="banda"/><text x="38" y="68" class="h">TIEMPO DE BUILD — en la máquina del equipo y en CI (no viaja al navegador)</text><rect x="40" y="80" width="230" height="42" rx="8" class="azul"/><text x="155" y="96" text-anchor="middle" class="n">mapa-unlam.svg</text><text x="155" y="114" text-anchor="middle" class="t">plano + grafo (2810×3745 px)</text><rect x="330" y="80" width="250" height="42" rx="8" class="azul"/><text x="455" y="96" text-anchor="middle" class="n">importar-plano.ts</text><text x="455" y="114" text-anchor="middle" class="t">→ datos-fuente/*.json</text><rect x="640" y="80" width="250" height="42" rx="8" class="azul"/><text x="765" y="96" text-anchor="middle" class="n">build.ts + validar-cierres</text><text x="765" y="114" text-anchor="middle" class="t">valida y genera public/data/</text><rect x="950" y="80" width="210" height="42" rx="8" class="ambar"/><text x="1055" y="96" text-anchor="middle" class="n">Deploy manual</text><text x="1055" y="114" text-anchor="middle" class="t">build + wrangler deploy</text><path d="M270,101 L330,101" class="flecha"/><path d="M580,101 L640,101" class="flecha"/><path d="M890,101 L950,101" class="flecha"/><rect x="24" y="140" width="1152" height="136" rx="10" class="banda"/><text x="38" y="160" class="h">HOSTING — Cloudflare Workers: solo archivos estáticos (sin código de servidor ni base de datos)</text><rect x="40" y="178" width="330" height="86" rx="8" class="verde"/><text x="52" y="198" text-anchor="start" class="n">public/data/ (generado en el build)</text><text x="52" y="216" text-anchor="start" class="t">grafo.json · 660 nodos, 690 aristas</text><text x="52" y="234" text-anchor="start" class="t">lugares.json · 291 lugares</text><text x="52" y="252" text-anchor="start" class="t">plano.json · mapa-base.svg y .webp</text><rect x="390" y="178" width="270" height="86" rx="8" class="ambar"/><text x="402" y="207" text-anchor="start" class="n">public/data/cierres.json</text><text x="402" y="225" text-anchor="start" class="t">editado a mano · hoy 0 cierres</text><text x="402" y="243" text-anchor="start" class="t">sin panel de administración</text><rect x="680" y="178" width="270" height="86" rx="8" class="ambar"/><text x="692" y="207" text-anchor="start" class="n">public/api/clima/*.json</text><text x="692" y="225" text-anchor="start" class="t">seco · lluvia · lento · error</text><text x="692" y="243" text-anchor="start" class="t">"fuente": "simulado"</text><rect x="970" y="178" width="190" height="86" rx="8" class="azul"/><text x="982" y="207" text-anchor="start" class="n">Bundle de la app</text><text x="982" y="225" text-anchor="start" class="t">index.html + JS/CSS</text><text x="982" y="243" text-anchor="start" class="t">(React 19, Leaflet)</text><path d="M1065,122 L1065,178" class="flecha"/><text x="1073" y="156" class="s" text-anchor="start">publica</text><rect x="24" y="296" width="1152" height="512" rx="10" class="banda"/><text x="224" y="316" class="h">DISPOSITIVO DEL USUARIO (PWA)</text><rect x="40" y="326" width="1120" height="66" rx="8" class="azul"/><text x="52" y="345" text-anchor="start" class="n">Service Worker (Workbox) — scripts/pwa/opciones.ts</text><text x="52" y="363" text-anchor="start" class="t">precache: app, grafo, lugares y plano · cierres.json: NetworkFirst con espera de 4 s y copia guardada</text><text x="52" y="381" text-anchor="start" class="t">/api/clima/*: solo red, nunca se guarda</text><path d="M205,326 L205,264" class="flecha"/><text x="213" y="288" class="s" text-anchor="start">HTTPS</text><path d="M525,326 L525,264" class="flecha"/><path d="M815,326 L815,264" class="flecha"/><path d="M1065,326 L1065,264" class="flecha"/><rect x="40" y="416" width="1120" height="70" rx="8" class="azul"/><text x="52" y="437" text-anchor="start" class="n">main.tsx → App.tsx — raíz de composición (512 líneas)</text><text x="52" y="455" text-anchor="start" class="t">carga los JSON (fetch dentro de useEffect), crea el orquestador de rutas, el monitor de conexión,</text><text x="52" y="473" text-anchor="start" class="t">los cierres y el recorrido guardado, y provee 5 contextos.  ⚠ Concentra datos, armado y restauración.</text><path d="M600,416 L600,392" class="flecha"/><text x="608" y="408" class="s" text-anchor="start">fetch()</text><rect x="40" y="516" width="480" height="186" rx="8" class="azul"/><text x="52" y="540" text-anchor="start" class="n">UI React — src/ui/</text><text x="52" y="558" text-anchor="start" class="t">Pantalla (hub) · hoja inferior · búsqueda · avisos</text><text x="52" y="576" text-anchor="start" class="t">Mapa: Leaflet + react-leaflet, plano SVG como imagen</text><text x="52" y="594" text-anchor="start" class="t">Estado: ControladorPantalla + reducer</text><rect x="56" y="622" width="448" height="66" rx="8" class="ambar"/><text x="280" y="650" text-anchor="middle" class="n">Herramientas de prueba (ocultas)</text><text x="280" y="668" text-anchor="middle" class="t">?panel=prueba · ?clima= · ?ahora= (fecha simulada)</text><rect x="570" y="516" width="590" height="186" rx="8" class="azul"/><text x="582" y="538" class="n">Dominio puro — sin React ni Leaflet (lo impone ESLint)</text><rect x="582" y="548" width="180" height="50" rx="6" class="azul"/><text x="672" y="568" text-anchor="middle" class="n">rutas</text><text x="672" y="586" text-anchor="middle" class="t">A* · heap · tramos</text><rect x="780" y="548" width="180" height="50" rx="6" class="ambar"/><text x="870" y="568" text-anchor="middle" class="n">clima</text><text x="870" y="586" text-anchor="middle" class="t">servicio simulado</text><rect x="978" y="548" width="180" height="50" rx="6" class="azul"/><text x="1068" y="568" text-anchor="middle" class="n">cierres</text><text x="1068" y="586" text-anchor="middle" class="t">vigencia · acceso (BFS)</text><rect x="582" y="608" width="180" height="50" rx="6" class="azul"/><text x="672" y="628" text-anchor="middle" class="n">busqueda</text><text x="672" y="646" text-anchor="middle" class="t">índice · recientes</text><rect x="780" y="608" width="180" height="50" rx="6" class="azul"/><text x="870" y="628" text-anchor="middle" class="n">conexion</text><text x="870" y="646" text-anchor="middle" class="t">monitor · reintentar</text><rect x="978" y="608" width="180" height="50" rx="6" class="azul"/><text x="1068" y="628" text-anchor="middle" class="n">datos</text><text x="1068" y="646" text-anchor="middle" class="t">tipos · persistencia</text><text x="582" y="684" class="s">Dependencias: datos ← rutas ← clima ← conexion · cierres → rutas, datos</text><path d="M280,486 L280,516" class="flecha"/><path d="M865,486 L865,516" class="flecha"/><path d="M520,600 L570,600" class="flecha"/><text x="545" y="592" class="s" text-anchor="middle">usa</text><rect x="40" y="732" width="1120" height="62" rx="8" class="verde"/><text x="52" y="749" text-anchor="start" class="n">Persistencia en el dispositivo (nada sale del teléfono)</text><text x="52" y="767" text-anchor="start" class="t">localStorage: recorrido en curso (2 h), recientes, último origen · sessionStorage: escenario de clima, fecha simulada</text><text x="52" y="785" text-anchor="start" class="t">Cache Storage: precache de la app y de los datos + caché «cierres»</text><path d="M280,702 L280,732" class="flecha"/><text x="288" y="722" class="s" text-anchor="start">lee / escribe</text><path d="M865,702 L865,732" class="flecha"/><rect x="24" y="826" width="26" height="16" rx="3" class="azul"/><text x="58" y="839" class="t">Construido y en uso</text><rect x="224" y="826" width="26" height="16" rx="3" class="ambar"/><text x="258" y="839" class="t">Simulado o cargado a mano (definido en el TP3)</text><rect x="604" y="826" width="26" height="16" rx="3" class="verde"/><text x="638" y="839" class="t">Datos y persistencia</text><rect x="824" y="826" width="26" height="16" rx="3" class="gris"/><text x="858" y="839" class="t">No existe en el MVP</text><rect x="24" y="856" width="560" height="70" rx="8" class="gris"/><text x="36" y="877" text-anchor="start" class="n">No existe en el MVP</text><text x="36" y="895" text-anchor="start" class="t">backend · base de datos · panel de administración · API de clima real</text><text x="36" y="913" text-anchor="start" class="t">geolocalización · servicio más cercano · horarios de atención</text><rect x="604" y="856" width="572" height="70" rx="8" class="gris"/><text x="616" y="877" text-anchor="start" class="n">Construido pero no conectado a la interfaz</text><text x="616" y="895" text-anchor="start" class="t">generarIndicaciones() (rutas/indicaciones.ts): solo la usan los tests;</text><text x="616" y="913" text-anchor="start" class="t">ResultadoRuta.tsx no muestra indicaciones paso a paso</text><text x="24" y="948" class="s">Flechas: «A → B» significa que A depende de B (lo importa o lo pide). Fuente: lectura de src/ y de src/openspec/ (noviembre de 2026).</text>
</svg>
