name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# La app vive en src/.
defaults:
  run:
    working-directory: src

jobs:
  verificar:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      # Genera public/data/ (grafo.json, lugares.json, ...): no se versiona y los tests y el
      # typecheck lo importan, así que tiene que existir antes de lint y typecheck.
      - run: npm run datos:build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # El build corre antes `npm run datos:build`: falla si el grafo no valida.
      - run: npm run build
      # Chequeo estricto de public/data/cierres.json contra el grafo generado por el build.
      - run: npm run validar-cierres
      - name: Subir reporte de datos del campus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-datos
          path: src/scripts/salida/reporte-datos.md
          if-no-files-found: ignore
          retention-days: 30

  e2e:
    name: E2E (Chromium móvil)
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Instalar Chromium
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Dependencias del sistema para Chromium
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - name: Subir reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/playwright-report/
            src/test-results/
          retention-days: 14

  # Publica en Cloudflare Workers (https://donde-queda.unlam.workers.dev) solo con un push a
  # main y solo si pasaron la verificación y los E2E. Necesita los secrets CLOUDFLARE_API_TOKEN y
  # CLOUDFLARE_ACCOUNT_ID en Settings → Secrets and variables → Actions.
  deploy:
    name: Deploy a Cloudflare Workers
    needs: [verificar, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Nunca se cortan dos deploys a la mitad: se encolan.
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/.nvmrc
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      # Corre datos:build, typecheck y vite build; deja todo en dist/.
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src
          wranglerVersion: '4'
          command: deploy
