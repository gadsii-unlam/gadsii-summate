# Cloudflare Workers con assets estáticos: `npx wrangler deploy` publica `dist/` (build de Vite).
# La caché está en `public/_headers`. El modo SPA sirve `index.html` (200) en cualquier ruta que no sea
# un archivo, como el `/* /index.html 200` que había en Netlify.
name = "donde-queda"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
